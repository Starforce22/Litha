name: (Una tantum) Crea nuova Collection Framer

on:
  workflow_dispatch: {}

jobs:
  create-collection:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Imposta Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installa le dipendenze
        run: npm install

      - name: Crea la nuova Collection
        env:
          FRAMER_API_KEY: ${{ secrets.FRAMER_API_KEY }}
          FRAMER_PROJECT_URL: ${{ secrets.FRAMER_PROJECT_URL }}
        run: npm run create-collection
