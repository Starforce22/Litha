name: Sincronizza Notion e pubblica Litha

on:
  schedule:
    # 6:00 e 20:00 UTC (7/8 e 21/22 in Italia, a seconda dell'ora legale)
    - cron: "0 6 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch: {}

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Imposta Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installa le dipendenze
        run: npm install

      - name: Esegui la sincronizzazione e pubblicazione
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          FRAMER_API_KEY: ${{ secrets.FRAMER_API_KEY }}
          FRAMER_PROJECT_URL: ${{ secrets.FRAMER_PROJECT_URL }}
          FRAMER_COLLECTION_ID: ${{ secrets.FRAMER_COLLECTION_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run sync
