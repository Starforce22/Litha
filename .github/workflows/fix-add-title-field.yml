name: (Una tantum) Aggiungi campo Titolo mancante

on:
  workflow_dispatch: {}

jobs:
  fix-add-title-field:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Imposta Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installa le dipendenze
        run: npm install

      - name: Aggiungi il campo Titolo
        env:
          FRAMER_API_KEY: ${{ secrets.FRAMER_API_KEY }}
          FRAMER_PROJECT_URL: ${{ secrets.FRAMER_PROJECT_URL }}
          FRAMER_COLLECTION_ID: ${{ secrets.FRAMER_COLLECTION_ID }}
        run: npm run fix-add-title-field
